format: "nfllm-project/v1"
project:
  name: "NFLLM"
  organization: "Panthera Softwares"
  release: "1.0 Experimental Research Release"
  description: "Single-threaded 32-bit DOS inference prototype for a narrow subset of GGUF v3 with the llama architecture."
architecture:
  dos_source: "source/nfllm/"
  upstream_reference: "source/upstream-llama.cpp/"
  upstream_reference_commit: "b79696f1f556cb30b0c184838115007d929baca8"
  upstream_relationship: "Unmodified reference snapshot; NFLLM is not a full llama.cpp port."
  components:
    - "C ABI v1 and static plugin registry/dispatcher"
    - "F32/x87 reference inference backend"
    - "Q8_0, Q4_0, Q2_0, Q2_K, IQ3_XXS and IQ3_S GGUF row decoders"
    - "Research kernels for 3DNow!, MMX and SSE2 profiles"
compatibility:
  baseline: "386+x87, selected explicitly; no runtime CPUID enumeration"
  verified_guest: "NF-DOS 5.01.3314 with DOS/4GW 1.97 in 86Box 6.0"
  verified_cpu_profile: "AMD Am486DX4 at 100 MHz, 96 MiB guest RAM"
  research_proxies:
    - "QEMU generic 486"
    - "QEMU Athlon ISA proxy for 3DNow!"
    - "QEMU MMX-capable ISA proxy"
    - "Isolated QEMU Atom N270 with CR4.OSFXSR enabled for SSE2"
  limitations:
    - "No physical Geode or Atom hardware validation"
    - "No standalone MS-DOS validation"
    - "SSE2 general DOS/DPMI XMM-state safety remains unverified"
    - "The DOS/4GW EFLAGS.ID probe was inconclusive and did not execute CPUID"
    - "The upstream llama.cpp runtime has not been ported to DOS"
models:
  included: false
  policy: "Users obtain compatible GGUF files from their original sources and review their separate licenses."
  instructions: "models/README.md"
builds:
  script: "source/nfllm/build-dos.cmd"
  compiler: "Open Watcom for Windows; set WATCOM to the toolchain root"
  generated_directory: "source/nfllm/build/"
  source_repository_contains_generated_builds: false
  distribution: "DOS executables and static libraries are published as a separate GitHub release ZIP."
license:
  nfllm_authored_source: "MIT"
  upstream_reference: "Retains upstream LICENSE and third-party notices."
  provenance_audit: "Pending; no claim of a complete port, fork, or wholly independent implementation."
