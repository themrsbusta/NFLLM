schema_version: 1
component: DOS/32 Advanced DOS Extender
project_usage: Bind DOS/32A into NFLLM 1.1 DOS Linear Executables.

source:
  repository: https://github.com/amindlost/dos32a
  ref: v26.1
  commit: 9c931b607e271414e32d43bd89fc50e1de5ffdcc
  copied_paths:
    - src/
    - dos32a_800/
    - README.md
    - LICENSE
  source_binary_build_match: unverified
  reason:
    - The checked-in source ref is v26.1 while the available Open Watcom package is labeled 26.1.2.
    - The source build requires historical TASM 5.3; that assembler is not installed in this environment.

binary_package:
  origin: Open Watcom DOS/32A package already present in the NF-DOS 6 workspace.
  archive_path_outside_this_tree: NF-DOS-6.0/sources/third-party/dos32a-26.1.2.zip
  archive_sha256: 8AF6E4D506986CD59403868CBA97C72DBAFA2C639F80F532C0D917821F3BD02C
  files:
    - path: bin/DOS32A.EXE
      bytes: 28336
      sha256: 63CD153A749052811486D79DD61C568054085192539B2618615B250DB4F24842
      role: DOS/32A runtime stub consumed by SB when binding LE files.
    - path: bin/SB.EXE
      bytes: 77620
      sha256: BBF0B581EA7EB401ACDB9959CBD6B5ED92FAA64148E8B7BFD356050F32CE37BF
      role: SUNSYS Bind Utility used only during the host build.
    - path: bin/SVER.EXE
      bytes: 16826
      sha256: A9C29A9F7A5C28E1FA2100475338FAEACBE6293050B2A8E443419DBCADCDB43B
      role: SUNSYS Version utility used to check bound outputs.

binding:
  linker_format: Watcom DOS/4G-compatible Linear Executable (LE).
  command_template: SB.EXE /B /BN<output.exe> <input.raw>
  verifier: SVER.EXE <bound-output.exe>
  build_helper: ../../bind-dos32a.cmd
  runtime_files_required_beside_output: []

license:
  file: LICENSE
  required_acknowledgment: This product uses DOS/32 Advanced DOS Extender technology.
  binary_notice: ../../THIRD-PARTY-NOTICES.md
